name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
      - run: npm run smoke:package
        timeout-minutes: 5
